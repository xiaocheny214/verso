[project]
name = "verso-app"
version = "0.1.0"
description = "verso 应用：server 领域 + web API/WS + worker MQ 适配 + bootstrap 装配"
requires-python = ">=3.12"
dependencies = [
    "verso-common",
    "verso-framework",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
verso = "verso_app.bootstrap.app:main"
verso-worker = "verso_app.bootstrap.worker:main"

[tool.uv.sources]
verso-common = { workspace = true }
verso-framework = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verso_app"]
