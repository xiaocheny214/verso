[project]
name = "verso-framework"
version = "0.1.0"
description = "verso 基础设施：配置 / DB / Redis / MQ / 实时频道 / 知乎与 LLM 提供方 / Trace"
requires-python = ">=3.12"
dependencies = [
    "verso-common",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "redis>=5.0",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "qiniu>=7.15",
    "pymilvus>=2.5.4,<2.6",
]

[tool.uv.sources]
verso-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verso_framework"]
