# RocketMQ 5 本地 Broker。gRPC 客户端只连代理端口 8081。
# brokerIP1 用 Docker Desktop 能解析的宿主机名，这样宿主机 uv 和 compose 内的后端
# 拿到的路由地址都是已映射出来的端口，而不是容器内网 IP。
brokerClusterName = verso-cluster
brokerName = verso-broker
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
brokerIP1 = host.docker.internal
listenPort = 10911
autoCreateTopicEnable = true
