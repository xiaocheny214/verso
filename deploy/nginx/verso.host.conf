# 宿主机 Nginx 样例。root 与 Compose 前端挂载目录一致。
# 后端容器把 8000 打到 127.0.0.1；静态文件由 frontend 服务写出。
#
#   docker compose up --build -d postgres redis backend frontend
#   再把本文件拷到 /etc/nginx/conf.d/verso.conf 并 reload。

upstream verso_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    root /var/www/verso-frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /match 是前端页面，接口在 /match/conditions，必须带尾斜杠。
    location /auth/          { proxy_pass http://verso_backend; }
    location = /me           { proxy_pass http://verso_backend; }
    location /me/            { proxy_pass http://verso_backend; }
    location /match/         { proxy_pass http://verso_backend; }
    location /exchanges      { proxy_pass http://verso_backend; }
    location /reviews        { proxy_pass http://verso_backend; }
    location = /health       { proxy_pass http://verso_backend; }
    location /docs           { proxy_pass http://verso_backend; }
    location = /redoc        { proxy_pass http://verso_backend; }
    location = /openapi.json { proxy_pass http://verso_backend; }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
