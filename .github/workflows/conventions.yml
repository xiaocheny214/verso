name: Conventions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          printf 'branch=%s\n' "$BRANCH"
          if printf '%s' "$BRANCH" | grep -Eq '^(feat|fix|docs|ci|chore|refactor|test|style|perf|revert)/#[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo 'branch name ok'
          else
            echo '::error::Branch must match <type>/#<issue>-<slug>, e.g. ci/#2-naming-conventions'
            exit 1
          fi
