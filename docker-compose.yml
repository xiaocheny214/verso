# ── Verso Docker Compose ─────────────────────────────────────────────
# 使用方式:
#   启动服务: docker compose up -d --build
#   查看日志: docker compose logs -f [service]
#   停止服务: docker compose down
#   清理数据: 停掉后删除 ./data/postgres 与 ./data/redis
#   重新构建: docker compose up -d --build
#
# worker 入口尚未接线，本期不起 worker 容器。
# 前端静态文件写到 /var/www/verso-frontend，由宿主机 nginx 读取并反代 API。

services:

  postgres:
    image: postgres:16-alpine
    container_name: verso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verso_dev}
      POSTGRES_DB: ${POSTGRES_DB:-verso}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verso} -d ${POSTGRES_DB:-verso}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - verso-net

  redis:
    image: redis:7-alpine
    container_name: verso-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - verso-net

  # ── 后端 API 服务 ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verso-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env 里是给本机 uv 用的 localhost；容器内必须走 compose 服务名。
      # POSTGRES_PORT 在 .env 里同时给宿主机端口映射用，这里钉容器内 5432。
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verso-net

  # ── 前端静态产物构建任务 ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建期烘进产物的后端地址，运行期改不动，所以放在 build.args 而非
        # environment。默认空字符串 → 与页面同源 → 不产生跨域，后端不必另配来源白名单。
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
    container_name: verso-frontend
    restart: "no"
    depends_on:
      - backend
    volumes:
      # 构建命令直接写入宿主机 nginx 的站点目录；容器退出后产物仍保留。
      - /var/www/verso-frontend:/var/www/verso-frontend
    networks:
      - verso-net

networks:
  verso-net:
    driver: bridge
    # 宿主机链路 MTU 若小于 1500，compose 自建网络不会继承 daemon 的 mtu，
    # 默认仍是 1500 → 大包被丢，表现为 TLS 握手超时（镜像源连不上、pip/pnpm 下载卡死）。
    driver_opts:
      com.docker.network.driver.mtu: "1450"
