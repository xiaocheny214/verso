# ── Verso Docker Compose ─────────────────────────────────────────────
# 使用方式:
#   启动服务: docker compose up -d --build
#   查看日志: docker compose logs -f [service]
#   停止服务: docker compose down
#   清理数据: 停掉后删除 ./data/postgres、./data/redis 与 ./data/milvus
#   重新构建: docker compose up -d --build
#
# worker 入口尚未接线，本期不起 worker 容器。
# 前端静态文件写到 /var/www/verso-frontend，由宿主机 nginx 读取并反代 API。

services:

  postgres:
    image: postgres:16-alpine
    container_name: verso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verso_dev}
      POSTGRES_DB: ${POSTGRES_DB:-verso}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verso} -d ${POSTGRES_DB:-verso}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - verso-net

  redis:
    image: redis:7-alpine
    container_name: verso-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - verso-net

  # OpenAI 兼容网关。应用只连这里的别名；上游地址和密钥在 LITELLM_*。
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: verso-litellm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-verso-dev}
      # 未填写时用占位，保证代理能起来。真正调用要换成带前缀的模型名和上游密钥。
      LITELLM_CHAT_MODEL: ${LITELLM_CHAT_MODEL:-openai/unset}
      LITELLM_CHAT_API_BASE: ${LITELLM_CHAT_API_BASE:-http://127.0.0.1:9/v1}
      LITELLM_CHAT_API_KEY: ${LITELLM_CHAT_API_KEY:-unset}
      LITELLM_EMBED_MODEL: ${LITELLM_EMBED_MODEL:-openai/unset}
      LITELLM_EMBED_API_BASE: ${LITELLM_EMBED_API_BASE:-http://127.0.0.1:9/v1}
      LITELLM_EMBED_API_KEY: ${LITELLM_EMBED_API_KEY:-unset}
      LITELLM_RERANK_MODEL: ${LITELLM_RERANK_MODEL:-cohere/unset}
      LITELLM_RERANK_API_BASE: ${LITELLM_RERANK_API_BASE:-http://127.0.0.1:9}
      LITELLM_RERANK_API_KEY: ${LITELLM_RERANK_API_KEY:-unset}
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - verso-net

  # 本地 standalone：内嵌 etcd + 本地盘，不另起 etcd / MinIO。
  milvus:
    image: milvusdb/milvus:v2.5.16
    container_name: verso-milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    volumes:
      - ./data/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s
    networks:
      - verso-net

  # ── 后端 API 服务 ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verso-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env 里是给本机 uv 用的 localhost；容器内必须走 compose 服务名。
      # POSTGRES_PORT 在 .env 里同时给宿主机端口映射用，这里钉容器内 5432。
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      # .env 里的 localhost:4000 只给宿主机 uv。容器内走服务名，密钥用代理 master key。
      VERSO_LLM_BASE_URL: http://litellm:4000
      VERSO_LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-verso-dev}
      VERSO_LLM_MODEL: chat
      VERSO_LLM_EMBEDDING_MODEL: embed
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - verso-net

  # ── 前端静态产物构建任务 ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建期烘进产物的后端地址，运行期改不动，所以放在 build.args 而非
        # environment。默认空字符串 → 与页面同源 → 不产生跨域，后端不必另配来源白名单。
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
    container_name: verso-frontend
    restart: "no"
    depends_on:
      - backend
    volumes:
      # 构建命令直接写入宿主机 nginx 的站点目录；容器退出后产物仍保留。
      - /var/www/verso-frontend:/var/www/verso-frontend
    networks:
      - verso-net

networks:
  verso-net:
    driver: bridge
    # 宿主机链路 MTU 若小于 1500，compose 自建网络不会继承 daemon 的 mtu，
    # 默认仍是 1500 → 大包被丢，表现为 TLS 握手超时（镜像源连不上、pip/pnpm 下载卡死）。
    driver_opts:
      com.docker.network.driver.mtu: "1450"
