# ── Verso 本地数据层 ────────────────────────────────────────────────
# 启动: docker compose up -d
# 日志: docker compose logs -f
# 停止: docker compose down
# 清数据: docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: verso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verso_dev}
      POSTGRES_DB: ${POSTGRES_DB:-verso}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - verso-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verso} -d ${POSTGRES_DB:-verso}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verso-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - verso-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  verso-postgres:
  verso-redis:
